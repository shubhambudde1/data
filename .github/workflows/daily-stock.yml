name: Daily Stock Fetch

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 4:30 PM IST (market close)
  workflow_dispatch:

permissions:
  contents: write   # ✅ REQUIRED to push changes

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # ✅ required for push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Script
        run: |
          python fetch_stock.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          git add stock_data.csv
          
          git commit -m "Update stock data" || echo "No changes to commit"
          
          git push